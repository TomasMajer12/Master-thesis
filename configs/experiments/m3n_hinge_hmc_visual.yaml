# M3N structured-hinge baseline on visual HMC chain (§5.2.2).
#
# Same role as m3n_hinge_hmc_symbolic.yaml but with MNIST images of the
# observation digits (T=30 cells per sequence, 1×28×28 each) and a
# LeNet-5 backbone. The notebook 02 lambda sweep overrides
# training.optimizer.weight_decay per run; this YAML only sets the
# default. weight_decay_phi / phi_init_std are absent (validator rejects
# them for non-lp_m3n losses).

experiment:
  name:   hmc_vis_m3n_hinge
  seed:   42
  device: auto

architecture: ../architectures/hmc_lenet5.yaml

data:
  task: hmc
  mode: visual
  paths:
    benchmark: benchmarks/hmc
    mnist:     mnist_data
  train_size: 3000
  val_size:   3000
  test_size:  10000
  batch_size: 32

training:
  loss: m3n_hinge
  inference:
    train: viterbi
    eval:  viterbi
  optimizer:
    type:         adam
    lr:           0.001    # smaller than symbolic-HMC's 0.01 because CNNs prefer
                           # smaller lr; the lambda LR schedule decays it further.
    weight_decay: 0.001
  num_epochs: 200
  scheduler:
    type:   lambda
    params: {offset: 100}
  eval_every: 3 
  early_stopping:
    monitor:   val_metrics.hamming
    patience:  60          # 15 evals × eval_every=3 = 45 epochs of no improvement
    min_delta: 0.001

logging:
  verbose: true
  print_metrics:
    - train_loss
    - val_metrics.hamming
