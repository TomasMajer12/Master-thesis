# LP-M3N on symbolic Sudoku
experiment:
  name:   sudoku_sym_lp_m3n
  seed:   42
  device: auto

architecture: ../architectures/linear_sudoku_symbolic.yaml

data:
  task: sudoku
  mode: symbolic
  paths:
    benchmark: benchmarks/sudoku
  train_size: 2000
  val_size:   10000
  test_size:  10000
  batch_size: 64

training:
  loss: lp_m3n
  inference:
    train: lp
    eval:  bp                     # cyclic graph → BP at evaluation time
    params: {bp_iters: 50}
  optimizer:
    type:             adam
    lr:               0.01
    weight_decay:     0.001       # gauge-pinning; overridden by sweep
    weight_decay_phi: 0.0
    phi_init_std:     0.0
    lr_phi:           0.0         
  num_epochs: 500
  scheduler:
    type:   lambda
    params: {offset: 100}
  eval_every: 5
  early_stopping:
    monitor:   val_metrics.zero_one
    patience:  20
    min_delta: 0.0

logging:
  verbose: true                    # print per-eval row to console
  print_metrics:
    - train_loss
    - val_metrics.hamming
    - val_metrics.zero_one
    - diagnostics.phi_norm
