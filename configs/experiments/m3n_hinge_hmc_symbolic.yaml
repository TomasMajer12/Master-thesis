# M3N structured-hinge baseline on symbolic HMC chain.
#
# Used as the oracle for the LP-M3N tightness validation: on chains,
# structured hinge with Viterbi loss-augmented inference is exact, so
# the test Hamming this run achieves is what LP-M3N must match.

experiment:
  name:   hmc_sym_m3n_hinge
  seed:   42
  device: auto

architecture: ../architectures/linear_chain.yaml

data:
  task: hmc
  mode: symbolic
  paths:
    benchmark: benchmarks/hmc
  train_size: 3000
  val_size:   3000
  test_size:  10000
  batch_size: 64

training:
  loss: m3n_hinge
  inference:
    train: viterbi
    eval:  viterbi
  optimizer:
    type:         adam
    lr:           0.01
    weight_decay: 0.001        

  num_epochs: 50
  scheduler:
    type:   lambda
    params: {offset: 100} 
  eval_every: 1
  early_stopping:
    monitor:   val_metrics.hamming
    patience:  50
    min_delta: 0.001

logging:
  verbose: false
  print_metrics:
    - train_loss
    - val_metrics.hamming
