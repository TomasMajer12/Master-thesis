experiment:
  name: hmc_vis_tightness/lp_m3n_wd0.01_seed2
  seed: 2
  device: auto
  output_dir: results/hmc_vis_tightness/lp_m3n_wd0.01_seed2
architecture:
  num_classes: 10
  backbone:
    type: config
    layers:
    - type: conv2d
      in_channels: 1
      out_channels: 6
      kernel_size: 5
      padding: 2
    - type: relu
    - type: maxpool2d
      kernel_size: 2
    - type: conv2d
      in_channels: 6
      out_channels: 16
      kernel_size: 5
    - type: relu
    - type: maxpool2d
      kernel_size: 2
    - type: conv2d
      in_channels: 16
      out_channels: 120
      kernel_size: 5
    - type: relu
    - type: flatten
      start_dim: 1
    - type: linear
      in_features: 120
      out_features: 84
    - type: relu
    - type: linear
      in_features: 84
      out_features: 10
    - type: Softmax
      dim: 1
    name: null
    pretrained: false
    freeze: false
    feature_dim: null
  graph:
    type: chain
    seq_len: 30
    path: null
    edges: null
  pairwise:
    init_scale: 0.1
data:
  task: hmc
  mode: visual
  paths:
    benchmark: benchmarks/hmc
    mnist: mnist_data
  train_size: 3000
  val_size: 3000
  test_size: 10000
  batch_size: 32
training:
  loss: lp_m3n
  inference:
    train: lp
    eval: viterbi
    params: {}
  optimizer:
    type: adam
    lr: 0.001
    weight_decay: 0.01
    weight_decay_phi: 0.0
    phi_init_std: 0.0
    lr_phi: 0.01
  num_epochs: 200
  scheduler:
    type: lambda
    params:
      offset: 100
  eval_every: 3
  early_stopping:
    monitor: val_metrics.hamming
    patience: 60
    min_delta: 0.001
logging:
  verbose: true
  print_metrics:
  - train_loss
  - val_metrics.hamming
  - diagnostics.phi_norm
