# LP-M3N on visual HMC chain

experiment:
  name:   hmc_vis_lp_m3n
  seed:   42
  device: auto

architecture: ../architectures/hmc_lenet5.yaml

data:
  task: hmc
  mode: visual
  paths:
    benchmark: benchmarks/hmc
    mnist:     mnist_data
  train_size: 3000
  val_size:   3000
  test_size:  10000
  batch_size: 32

training:
  loss: lp_m3n
  inference:
    train: lp
    eval:  viterbi
  optimizer:
    type:             adam
    lr:               0.001
    weight_decay:     0.001
    weight_decay_phi: 0.0
    phi_init_std:     0.0
    lr_phi:           0.01
  num_epochs: 200
  scheduler:
    type:   lambda
    params: {offset: 100}
  eval_every: 3           
  early_stopping:
    monitor:   val_metrics.hamming
    patience:  60 
    min_delta: 0.001

logging:
  verbose: true
  print_metrics:
    - train_loss
    - val_metrics.hamming
    - diagnostics.phi_norm
