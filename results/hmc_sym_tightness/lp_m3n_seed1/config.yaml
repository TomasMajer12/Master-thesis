experiment:
  name: hmc_sym_tightness/lp_m3n_seed1
  seed: 1
  device: auto
  output_dir: results/hmc_sym_tightness/lp_m3n_seed1
architecture:
  num_classes: 10
  backbone:
    type: config
    layers:
    - type: linear
      in_features: 10
      out_features: 10
    name: null
    pretrained: false
    freeze: false
    feature_dim: null
  graph:
    type: chain
    seq_len: 30
    path: null
    edges: null
  pairwise:
    init_scale: 0.1
data:
  task: hmc
  mode: symbolic
  paths:
    benchmark: benchmarks/hmc
  train_size: 3000
  val_size: 3000
  test_size: 10000
  batch_size: 64
training:
  loss: lp_m3n
  inference:
    train: lp
    eval: viterbi
    params: {}
  optimizer:
    type: adam
    lr: 0.01
    weight_decay: 0.001
    weight_decay_phi: 0.0
    phi_init_std: 0.0
    lr_phi: 0.0
  num_epochs: 50
  scheduler:
    type: lambda
    params:
      offset: 100
  eval_every: 1
  early_stopping:
    monitor: val_metrics.hamming
    patience: 50
    min_delta: 0.001
logging:
  verbose: false
  print_metrics:
  - train_loss
  - val_metrics.hamming
  - diagnostics.phi_norm
