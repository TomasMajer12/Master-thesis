# M3N structured-hinge baseline on visual HMC chain

experiment:
  name:   hmc_vis_m3n_hinge
  seed:   42
  device: auto

architecture: ../architectures/hmc_lenet5.yaml

data:
  task: hmc
  mode: visual
  paths:
    benchmark: benchmarks/hmc
    mnist:     mnist_data
  train_size: 3000
  val_size:   3000
  test_size:  10000
  batch_size: 32

training:
  loss: m3n_hinge
  inference:
    train: viterbi
    eval:  viterbi
  optimizer:
    type:         adam
    lr:           0.001
    weight_decay: 0.001
  num_epochs: 200
  scheduler:
    type:   lambda
    params: {offset: 100}
  eval_every: 3 
  early_stopping:
    monitor:   val_metrics.hamming
    patience:  60          
    min_delta: 0.001

logging:
  verbose: true
  print_metrics:
    - train_loss
    - val_metrics.hamming
