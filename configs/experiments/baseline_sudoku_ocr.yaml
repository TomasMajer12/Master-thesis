# Two-stage OCR baselin.


experiment:
  name:   baseline_sudoku_ocr
  seed:   42
  device: auto

architecture: ../architectures/ocr_lenet5.yaml

data:
  task: sudoku
  mode: visual
  paths:
    benchmark: benchmarks/sudoku
    mnist:     mnist_data
  train_size: 1000              # overridden per run by the notebook
  val_size:   10000
  test_size:  10000             # matches notebook 05 for headline comparison
  batch_size: 64

training:
  loss: cross_entropy
  optimizer:
    type:         adam
    lr:           0.001
    weight_decay: 0.0001
  num_epochs: 200
  scheduler:
    type: lambda
    params:
      offset: 100
  eval_every: 2
  early_stopping:
    monitor:   val_error
    patience:  15
    min_delta: 0.000

logging:
  verbose: true
